<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Minha "Primeira" Tabela</h1>
   <table>
    <caption>Tabela de Exemplo</caption>
        <thead>
            <tr>
                <th id="blank">&nbsp;</th>
                <th scope="col">A</th>
                <th scope="col">B</th>
                <th scope="col">C</th>
                <th scope="col">D</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">1</th>
                <td>A1</td>
                <td>A2</td>
                <td>A3</td>
                <td>A4</td>
            </tr>
            <tr>
                <th scope="row">2</th>
                <td>B1</td>
                <td>B2</td>
                <td>B3</td>
                <td>B4</td>
            </tr>
            <tr>
                <th scope="row">3</th>
                <td>C1</td>
                <td>C2</td>
                <td>C3</td>
                <td>C4</td>
            </tr>
            <tr>
                <th scope="row">4</th>
                <td>D1</td>
                <td>D2</td>
                <td>D3</td>
                <td>D4</td>
            </tr>
            <tr>
                <th scope="row">5</th>
                <td>E1</td>
                <td>E2</td>
                <td>E3</td>
                <td>E4</td>
            </tr>
            <tr>
                <th scope="row">6</th>
                <td>F1</td>
                <td>F2</td>
                <td>F3</td>
                <td>F4</td>
            </tr>
            <tr>
                <th scope="row">7</th>
                <td>G1</td>
                <td>G2</td>
                <td>G3</td>
                <td>G4</td>
            </tr>
            <tr>
                <th scope="row">8</th>
                <td>H1</td>
                <td>H2</td>
                <td>H3</td>
                <td>H4</td>
            </tr>
            <tr>
                <th scope="row">9</th>
                <td>I1</td>
                <td>I2</td>
                <td>I3</td>
                <td>I4</td>
            </tr>
            <tr>
                <th scope="row">10</th>
                <td>J1</td>
                <td>J2</td>
                <td>J3</td>
                <td>J4</td>
            </tr>


        </tbody>
        <tfoot></tfoot>
            <tr>
                <td colspan="5">Rodapé da tabela</td>
            </tr>
        
   </table> 
</body>
</html>
